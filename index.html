:root {
	color-scheme: dark;
	--fond: #0a0908;
	--carte: #13110e;
	--trait: #2a251f;
	--texte: #ece6da;
	--doux: #a39a8b;
	--or: #d9b56a;
	--tib: "Noto Serif Tibetan Mantras", "Noto Serif Tibetan", "Microsoft Himalaya", "Jomolhari", serif;
	--serif: "Spectral", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	background: radial-gradient(ellipse 80% 50% at 50% 0%, #17130f 0%, var(--fond) 70%) fixed, var(--fond);
	color: var(--texte);
	font-family: var(--serif);
	font-weight: 300;
	line-height: 1.6;
	padding-inline: 16px;
	min-height: 100vh;
}
.page { max-width: 1120px; margin: 0 auto; padding-block: 64px 48px; }
header { text-align: center; margin-bottom: 56px; }
.titre-tib { font-family: var(--tib); font-weight: 500; font-size: clamp(30px, 6vw, 48px); line-height: 1.5; margin: 0; color: var(--or); }
h1 { font-weight: 300; font-size: clamp(26px, 4vw, 38px); letter-spacing: 0.01em; margin: 4px 0 12px; text-wrap: balance; }
.chapeau { color: var(--doux); max-width: 34em; margin: 0 auto; font-style: italic; }
.grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 380px)); justify-content: center; gap: 28px; list-style: none; margin: 0; padding: 0; }
.carte a {
	display: flex; flex-direction: column; height: 100%;
	background: var(--carte); border: 1px solid var(--trait); border-radius: 6px; overflow: hidden;
	color: inherit; text-decoration: none;
	transition: border-color .25s, transform .25s;
}
.carte a:hover, .carte a:focus-visible { border-color: var(--or); transform: translateY(-2px); }
.carte a:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }
.vignette { position: relative; aspect-ratio: 16 / 9; background: #000; max-width: 100%; }
.vignette img { display: block; width: 100%; height: 100%; object-fit: cover; }
.vignette .lire {
	position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%;
	background: rgba(10, 9, 8, .72); border: 1px solid rgba(217, 181, 106, .6);
	display: grid; place-items: center; opacity: .85; transition: opacity .25s;
}
.vignette .lire::before { content: ""; border-left: 13px solid var(--or); border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px; }
.carte a:hover .lire { opacity: 1; }
.corps { padding: 24px 20px 22px; display: flex; flex-direction: column; gap: 6px; }
.tib { font-family: var(--tib); font-weight: 500; font-size: 30px; line-height: 1.7; letter-spacing: 0.02em; }
.tib span + span { margin-left: .35em; }
h2 { font-size: 21px; font-weight: 500; margin: 0; }
.desc { color: var(--doux); margin: 0; font-size: 16px; }
.meta { margin-top: 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--or); font-variant-numeric: tabular-nums; }
footer { margin-top: 56px; text-align: center; color: var(--doux); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .carte a { transition: none; } .carte a:hover { transform: none; } }
</style>

				"#ee922e"
			],
			[
				"པ",
				"#ec9a32"
			],
			[
				"ཙ",
				"#eba136"
			],
			[
				"ན",
				"#e9a93a"
			],
			[
				"དྷཱིཿ",
				"#f2c230"
			]
		]
	}
]/*MANTRAS-FIN*/;

const grille = document.getElementById('grille');
for (const m of MANTRAS) {
	const li = document.createElement('li');
	li.className = 'carte';
	const tib = m.syllabes.map(([s, c]) => {
		const noir = parseInt(c.slice(1, 3), 16) + parseInt(c.slice(3, 5), 16) + parseInt(c.slice(5, 7), 16) < 60;
		const ombre = noir ? 'text-shadow:0 0 2px rgba(255,230,194,.95),0 0 10px rgba(255,230,194,.45)' : `text-shadow:0 0 12px ${c}55`;
		return `<span style="color:${c};${ombre}">${s}</span>`;
	}).join('');
	li.innerHTML = `<a href="${m.page}">
		<div class="vignette"><img src="${m.couverture}" alt="" loading="lazy" width="1920" height="1080"><span class="lire" aria-hidden="true"></span></div>
		<div class="corps">
			<div class="tib" lang="bo">${tib}</div>
			<h2>${m.titre}</h2>
			<p class="desc">${m.description}</p>
			<p class="meta">Animation 16:9 · ${m.duree}</p>
		</div></a>`;
	grille.appendChild(li);
}
const n = MANTRAS.length;
document.getElementById('pied').textContent = n + (n > 1 ? ' mantras' : ' mantra') + ' · cliquez sur une carte pour ouvrir l’animation';
</script>
