html, body { height: 100%; margin: 0; background: var(--fond); overflow: hidden; cursor: none; }
body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage {
	position: absolute; left: 50%; top: 50%;
	width: 1920px; height: 1080px; overflow: hidden;
	background: var(--nuit);
	transform-origin: 50% 50%;
	transform: translate(-50%, -50%) scale(0.5);
}
#bg, #vignette, #grain { position: absolute; inset: 0; pointer-events: none; }
#bg { background: radial-gradient(ellipse 72% 62% at 50% 47%, var(--nuit-coeur) 0%, var(--nuit) 58%, #050404 100%); }
#vignette { background: radial-gradient(ellipse 88% 80% at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.62) 100%); }
#grain { opacity: 0.08; mix-blend-mode: soft-light; background-size: 256px 256px; }
#world { position: absolute; inset: 0; }
.pt { position: absolute; width: 0; height: 0; }
.bloom, .ring, #aura { position: absolute; pointer-events: none; border-radius: 50%; }
.bloom { width: 600px; height: 600px; left: -300px; top: -300px; }
.ring { box-sizing: border-box; border: 2px solid; }
#aura { width: 1900px; height: 640px; left: -950px; top: -320px; }
.glyph { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.glyph span {
	position: absolute; white-space: nowrap;
	font-family: var(--tib); font-weight: 500; font-size: 210px; line-height: 1;
}
#probe { position: absolute; left: -4000px; top: 0; visibility: hidden; font-family: var(--tib); font-weight: 500; font-size: 210px; line-height: 1; white-space: nowrap; }
#probe i { display: inline-block; width: 0; height: 0; vertical-align: baseline; }

	<div id="grain"></div>
	<span id="probe">མ<i></i></span>
</div>

<script>
(() => {
	'use strict';
	const TL = {"T":19.4,"ting":0.1,"syl":[0.85,1.3,1.75,2.2,2.65,3.1,3.55,4.0,4.45,4.9,5.35,5.8,6.25,6.7,7.15,7.6,8.05,8.5,8.95],"full":10.011,"big":14.601,"fadeA":[17.2,19.2],"fadeV":[17.3,18.6],"fullOnsets":[0.01,0.58,0.86,1.075,1.24,1.505,1.67,1.98,2.13,2.35,2.49,2.71,2.935,3.245,3.385,3.571,3.81,3.975,4.175]};
	const UNITS = [{"t": "ཏདྱཐཱ", "c": "#e9a93a"}, {"t": "ༀ", "c": "#f4efe4"}, {"t": "ག", "c": "#e9a93a"}, {"t": "ཏེ", "c": "#eaab39"}, {"t": "ག", "c": "#eaac39"}, {"t": "ཏེ", "c": "#ebae38"}, {"t": "པཱ", "c": "#ebaf38"}, {"t": "ར", "c": "#ecb137"}, {"t": "ག", "c": "#ecb236"}, {"t": "ཏེ", "c": "#edb436"}, {"t": "པཱ", "c": "#eeb635"}, {"t": "ར", "c": "#eeb734"}, {"t": "སཾ", "c": "#efb934"}, {"t": "ག", "c": "#efba33"}, {"t": "ཏེ", "c": "#f0bc32"}, {"t": "བོ", "c": "#f0bd32"}, {"t": "དྷི", "c": "#f1bf31"}, {"t": "སྭཱ", "c": "#f1c031"}, {"t": "ཧཱ", "c": "#f2c230"}];   // [{ t: syllabe, c: '#rrggbb' }, …] dans l'ordre de lecture
	const T = TL.T;
	const HALO = [255, 230, 194];
	const hex = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16));
	const lum = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
	const SYL = UNITS.map(u => {
		const col = hex(u.c);
		const hum = lum(col) < 0.08;                       // syllabe noire : contre-jour
		const glow = hum ? HALO : (lum(col) > 0.85 ? [255, 247, 230] : col);
		return { txt: u.t, col, glow, hum };
	});
	const N = SYL.length;
	const FS0 = 210;           // corps de référence (px) ; réduit si le mantra est long
	const GAP0 = 128;          // intervalle constant entre les encres de deux syllabes voisines (au corps de référence)
	const MAXW = 1640;         // largeur utile d'une ligne
	const MID_Y = 528;         // centre optique du bloc (un peu au-dessus du milieu)
	let FS = FS0, K = 1;       // corps retenu et facteur d'échelle des effets
	const CAPTURE = /[?&]capture\b/.test(location.search);
	const RM = !CAPTURE && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

	const stage = document.getElementById('stage');
	const world = document.getElementById('world');
	const center = document.getElementById('center');
	const aura = document.getElementById('aura');
	const ringTing = document.getElementById('ring-ting');
	const ringBig = document.getElementById('ring-big');
	const grain = document.getElementById('grain');

	const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a)).toFixed(4)})`;
	const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
	const smooth = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * (3 - 2 * u); };
	const easeOut = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
	const easeInOut = u => { u = clamp(u, 0, 1); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
	const pulse = (t, t0, att, tau) => { if (t < t0) return 0; const x = t - t0; return x < att ? x / att : Math.exp(-(x - att) / tau); };

	// ---------- construction des syllabes ----------
	const els = SYL.map((s, i) => {
		const pt = document.createElement('div'); pt.className = 'pt' + (s.hum ? ' hum' : '');
		const bloom = document.createElement('div'); bloom.className = 'bloom';
		const c = s.hum ? HALO : s.glow;
		bloom.style.background = `radial-gradient(circle at 50% 50%, ${rgba(c, 0.55)} 0%, ${rgba(c, 0.24)} 26%, ${rgba(c, 0.07)} 50%, ${rgba(c, 0)} 70%)`;
		const ring = document.createElement('div'); ring.className = 'ring'; ring.style.borderColor = rgba(c, 1);
		const glyph = document.createElement('div'); glyph.className = 'glyph';
		const mk = cls => { const sp = document.createElement('span'); sp.className = cls; sp.textContent = s.txt; glyph.appendChild(sp); return sp; };
		const g2 = mk('g2'), g1 = mk('g1'), core = mk('core');
		g2.style.color = rgba(s.hum ? HALO : s.glow, 1);
		g1.style.color = rgba(s.hum ? HALO : s.glow, 1);
		core.style.color = rgba(s.col, 1);
		pt.append(bloom, ring, glyph);
		world.appendChild(pt);
		return { pt, bloom, ring, glyph, g1, g2, core, spans: [g2, g1, core] };
	});

	// ---------- mise en place : mesure de l'encre réelle (canvas) et de la ligne de base (DOM) ----------
	// Une ligne si elle tient à un corps ≥ 160 px, sinon deux lignes équilibrées ; têtes alignées sur chaque ligne.
	let CORE_Y = MID_Y, LINE_X = 960, LINES = 1;
	function measure(fs) {
		const cv = document.createElement('canvas').getContext('2d');
		cv.font = `500 ${fs}px "Noto Serif Tibetan Mantra"`;
		return { m: SYL.map(s => cv.measureText(s.txt)), mm: cv.measureText('མ') };
	}
	const rowW = (W, a, b, gap) => W.slice(a, b).reduce((x, y) => x + y, 0) + gap * (b - a - 1);
	function layout() {
		let { m } = measure(FS0);
		let W = m.map(k => k.actualBoundingBoxLeft + k.actualBoundingBoxRight);
		let rows = [[0, N]];
		const one = rowW(W, 0, N, GAP0);
		if (one > MAXW && FS0 * MAXW / one < 160 && N > 1) {
			let best = 1, bestW = Infinity;
			for (let k = 1; k < N; k++) { const w = Math.max(rowW(W, 0, k, GAP0), rowW(W, k, N, GAP0)); if (w < bestW) { bestW = w; best = k; } }
			rows = [[0, best], [best, N]];
			FS = FS0 * Math.min(1, MAXW / bestW);
		} else {
			FS = FS0 * Math.min(1, MAXW / one);
		}
		K = FS / FS0;
		LINES = rows.length;
		const gap = GAP0 * K;
		const probe = document.getElementById('probe');
		probe.style.fontSize = FS + 'px';
		const marker = probe.querySelector('i');
		const baseOff = marker.offsetTop; // ligne de base depuis le haut de la boîte (#probe est positionné)
		const ms = measure(FS); m = ms.m;
		W = m.map(k => k.actualBoundingBoxLeft + k.actualBoundingBoxRight);
		const coreH = (ms.mm.actualBoundingBoxAscent - ms.mm.actualBoundingBoxDescent) / 2;
		const asc = r => Math.max(...m.slice(r[0], r[1]).map(x => x.actualBoundingBoxAscent));
		const desc = r => Math.max(...m.slice(r[0], r[1]).map(x => x.actualBoundingBoxDescent));
		const lead = FS * 0.42;                                 // interligne entre l'encre la plus basse et la plus haute
		const bases = [];
		let y = 0;
		rows.forEach((r, j) => { if (j > 0) y += desc(rows[j - 1]) + lead + asc(r); bases.push(y); });
		const top = bases[0] - asc(rows[0]), bottom = bases[bases.length - 1] + desc(rows[rows.length - 1]);
		const shift = MID_Y - (top + bottom) / 2;
		rows.forEach((r, j) => {
			const base = bases[j] + shift;
			const coreY = base - coreH;
			let xRun = LINE_X - rowW(W, r[0], r[1], gap) / 2;
			for (let i = r[0]; i < r[1]; i++) {
				const x = xRun + W[i] / 2;
				xRun += W[i] + gap;
				const e = els[i], k = m[i];
				const inkCX = (k.actualBoundingBoxRight - k.actualBoundingBoxLeft) / 2;
				const inkCY = base - (k.actualBoundingBoxAscent - k.actualBoundingBoxDescent) / 2;
				e.pt.style.left = x + 'px';
				e.pt.style.top = coreY + 'px';
				e.glyph.style.left = '0px';
				e.glyph.style.top = (inkCY - coreY) + 'px';
				e.spans.forEach(sp => { sp.style.fontSize = FS + 'px'; sp.style.left = (-inkCX) + 'px'; sp.style.top = (base - baseOff - inkCY) + 'px'; });
				e.g2.style.filter = `blur(${((SYL[i].hum ? 24 : 34) * K).toFixed(2)}px)`;
				e.g1.style.filter = `blur(${((SYL[i].hum ? 2.5 : 7) * K).toFixed(2)}px)`;
				const bd = 600 * K;
				e.bloom.style.width = e.bloom.style.height = bd + 'px';
				e.bloom.style.left = e.bloom.style.top = (-bd / 2) + 'px';
			}
		});
		CORE_Y = MID_Y;
		center.style.left = LINE_X + 'px';
		center.style.top = CORE_Y + 'px';
		const ah = 640 * (LINES === 1 ? 1 : 1.55);
		aura.style.height = ah + 'px'; aura.style.top = (-ah / 2) + 'px';
		world.style.transformOrigin = `${LINE_X}px ${CORE_Y}px`;
	}

	// ---------- grain (tuiles déterministes) ----------
	const tiles = [];
	(function makeGrain() {
		let seed = 1088;
		const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
		for (let k = 0; k < 4; k++) {
			const c = document.createElement('canvas'); c.width = c.height = 256;
			const g = c.getContext('2d'); const im = g.createImageData(256, 256);
			for (let p = 0; p < im.data.length; p += 4) { const v = rnd() * 255; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255; }
			g.putImageData(im, 0, 0); tiles.push(`url(${c.toDataURL('image/png')})`);
		}
	})();

	function setRing(el, t, t0, d0, d1, dur, a0, col) {
		const r = (t - t0) / dur;
		if (t < t0 || r >= 1) { el.style.opacity = '0'; return; }
		const d = d0 + (d1 - d0) * easeOut(r);
		el.style.width = el.style.height = d + 'px';
		el.style.left = el.style.top = (-d / 2) + 'px';
		el.style.opacity = (a0 * Math.pow(1 - r, 1.7)).toFixed(4);
		if (col) el.style.borderColor = col;
	}

	// ---------- rendu déterministe : tout dépend de t ----------
	function render(tIn) {
		const t = Math.min(Math.max(tIn, 0), T);
		const [fv0, fv1] = TL.fadeV;
		const zoom = RM ? 1 : 1 + 0.045 * easeInOut(t / T);
		world.style.transform = `scale(${zoom.toFixed(5)})`;

		const breathOn = smooth(TL.big, TL.big + 1.2, t);
		const un = pulse(t, TL.big, 0.14, 1.5);
		const gFade = 1 - smooth(fv0, fv1 + 0.3, t);

		// halo général : éclat du tingsha, puis grand bol
		const auraA = 0.28 * pulse(t, TL.ting, 0.25, 0.9) + 0.85 * pulse(t, TL.big, 0.3, 2.6) + 0.30 * breathOn * gFade;
		aura.style.opacity = auraA.toFixed(4);
		aura.style.background = `radial-gradient(ellipse at 50% 50%, ${rgba(HALO, 0.15)} 0%, ${rgba(HALO, 0.06)} 38%, ${rgba(HALO, 0)} 70%)`;
		setRing(ringTing, t, TL.ting, 120, 1500, 2.2, 0.20, rgba(HALO, 1));
		setRing(ringBig, t, TL.big, 300, 2400, 2.8, 0.30, rgba(HALO, 1));

		SYL.forEach((s, i) => {
			const e = els[i];
			const on = TL.syl[i];
			const rev = easeOut((t - (on - 0.15)) / 0.58);
			const vis = smooth(on - 0.15, on + 0.30, t);
			const flash = pulse(t, on, 0.07, 0.55);
			const res = smooth(on, on + 0.7, t);
			const hOn = TL.full + TL.fullOnsets[i];
			const h = pulse(t, hOn, 0.04, 0.30);
			const br = breathOn * (0.5 + 0.5 * Math.sin(2 * Math.PI * (t - TL.big) / 3.4 - i * 0.6));
			const f0 = fv0 + i * Math.min(0.07, 0.9 / Math.max(1, N - 1));
			const f = 1 - smooth(f0, f0 + 0.95, t);
			const out = 1 - f;

			const ty = RM ? 0 : 18 * (1 - rev) - 10 * out;
			const sc = (0.93 + 0.07 * rev) * (1 + 0.08 * h + 0.025 * un);
			const blur = 15 * (1 - rev) + 9 * out;
			e.glyph.style.transform = `translate(0px, ${ty.toFixed(2)}px) scale(${sc.toFixed(4)})`;
			e.glyph.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
			e.glyph.style.opacity = (vis * f).toFixed(4);

			const G = res * (0.62 + 0.22 * br) + 1.1 * flash + 1.3 * h + 0.6 * un;
			if (s.hum) {
				e.g1.style.opacity = Math.min(1, 0.85 + 0.15 * G).toFixed(4);
				e.g2.style.opacity = Math.min(1, 0.45 * G + 0.25).toFixed(4);
			} else {
				e.g1.style.opacity = Math.min(1, 0.42 * G).toFixed(4);
				e.g2.style.opacity = Math.min(1, 0.36 * G).toFixed(4);
			}

			const resB = s.hum ? 0.46 : 0.17;
			const B = (0.95 * flash + res * (resB + 0.07 * br) + 0.6 * h + 0.45 * un) * f;
			const bs = 0.68 + 0.32 * easeOut((t - on) / 0.9) + 0.12 * h + 0.08 * un;
			e.bloom.style.opacity = B.toFixed(4);
			e.bloom.style.transform = `scale(${bs.toFixed(4)})`;
			setRing(e.ring, t, on - 0.02, 150 * K, 720 * K, 1.8, (s.hum ? 0.42 : 0.5) * (N > 9 ? 0.75 : 1));
		});

		const fr = Math.round(t * 30);
		grain.style.backgroundImage = tiles[fr % 4];
		grain.style.backgroundPosition = `${(fr * 73) % 256}px ${(fr * 151) % 256}px`;
	}

	function fit() {
		const pad = CAPTURE ? 0 : 16;
		const w = Math.max(1, window.innerWidth - 2 * pad), h = Math.max(1, window.innerHeight - 2 * pad);
		const s = CAPTURE ? 1 : Math.min(w / 1920, h / 1080);
		stage.style.transform = `translate(-50%, -50%) scale(${s})`;
	}
	window.addEventListener('resize', fit);
	fit();

	window.render = render;
	window.DURATION = T;
	window.__layout = () => ({ fs: +FS.toFixed(1), lines: LINES, pts: els.map(e => [+parseFloat(e.pt.style.left).toFixed(1), +parseFloat(e.pt.style.top).toFixed(1)]) });
	window.__audio = () => ({ state: ac ? ac.state : 'none', decoded: !!buf, on: audioOn, t: +clock().toFixed(3) });
